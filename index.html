<!DOCTYPE html>
<html lang="en-us">
<head>
    <script src="https://telegram.org/js/telegram-web-app.js?56"></script>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <title>Unity Web Player | SkybullBaseTemplate</title>
        <link rel="shortcut icon" href="TemplateData/favicon.ico">
        <link rel="stylesheet" href="TemplateData/style.css">
        <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
        <style>
            html, body {
                margin: 0;
                padding: 0;
                overflow: hidden;
                height: 100%;
                width: 100%;
                background: black;
            }

            #unity-container {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                overflow: hidden;
                background: black;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            #unity-canvas {
                display: block;
                background: black;
            }
        </style>
    </head>
  <body>
      <div id="unity-container" class="unity-desktop">
          <canvas id="unity-canvas" width=1080 height=1920 tabindex="-1">
          </canvas>
          <div id="unity-loading-bar">
              <div id="unity-logo"></div>
              <div id="unity-progress-bar-empty">
                  <div id="unity-progress-bar-full"></div>
              </div>
          </div>
          <div id="unity-warning"> </div>
          <div id="unity-footer">
          </div>
      </div>
    <script>
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();


      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/Meme_BuildDev.loader.js";
        var config = {
            arguments: [],
            dataUrl: buildUrl + "/Meme_BuildDev.data.unityweb",
            frameworkUrl: buildUrl + "/Meme_BuildDev.framework.js.unityweb",
            codeUrl: buildUrl + "/Meme_BuildDev.wasm.unityweb",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "Skybull",
            productName: "skybull-hybrid-casual-framwork1",
            productVersion: "0.1.0",
            showBanner: unityShowBanner,
        };

        function maintainAspectRatio() {
            const containerWidth = window.innerWidth;
            const containerHeight = window.innerHeight;
            const targetAspectRatio = 9 / 16;
            const containerAspectRatio = containerWidth / containerHeight;

            let newWidth, newHeight;

            if (containerAspectRatio > targetAspectRatio) {
                newHeight = containerHeight;
                newWidth = newHeight * targetAspectRatio;
            } else {
                newWidth = containerWidth;
                newHeight = newWidth / targetAspectRatio;
            }

            canvas.style.width = newWidth + "px";
            canvas.style.height = newHeight + "px";
        }

        window.addEventListener("resize", maintainAspectRatio);
        window.addEventListener("load", maintainAspectRatio);

        document.querySelector("#unity-loading-bar").style.display = "block";

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;

      }

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                  document.querySelector("#unity-loading-bar").style.display = "none";
                  document.addEventListener("visibilitychange", function () {
                      if (document.hidden) {
                          unityInstance.SendMessage("AudioManager", "PauseMusicFromJS");
                      } else {
                          unityInstance.SendMessage("AudioManager", "ResumeMusicFromJS");
                      }
                  });

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
